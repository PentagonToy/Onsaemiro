[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onsaemiro"
version = "1.0.2"
description = "Publication-quality scientific visualisation and reporting utilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Hanseul Kang", email = "hanseul.kang@aalto.fi"}
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "matplotlib",
    "rich",
    "ipython",
]
keywords = [
    "matplotlib",
    "scientific-visualisation",
    "publication",
    "plotting",
    "jupyter",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Repository = "https://github.com/PentagonToy/Onsaemiro"
Issues = "https://github.com/PentagonToy/Onsaemiro/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
